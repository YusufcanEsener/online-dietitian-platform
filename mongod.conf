# mongod.conf - Güvenli MongoDB Yapılandırması
# Online Dietitian Platform

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

net:
  port: 27017
  # Docker container içinde 0.0.0.0'a bind etmek ZORUNLU
  # Güvenlik docker-compose'da sağlanır (port dışarıya açılmaz)
  bindIp: 0.0.0.0
  maxIncomingConnections: 100

security:
  authorization: enabled

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp
