# Nginx Reverse Proxy + SPA Routing
# Frontend ve Backend tek port üzerinden sunulur
# /api → backend:8000 (proxy)
# /    → SPA (index.html)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Backend API proxy - /api istekleri backend'e yönlendirilir
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzun işlemler için timeout (AI analiz vb.)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger/OpenAPI docs proxy
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    # Statik dosyalar için cache (1 yıl)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: Bulunamayan yolları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
