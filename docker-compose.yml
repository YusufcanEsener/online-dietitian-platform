# docker-compose.yml - Online Dietitian Platform (PRODUCTION HARDENED)
# Kullanım: docker compose --env-file .env.production up -d --build
#
# Network mimarisi:
#   frontend-net: frontend ↔ backend (dış erişim açık)
#   backend-net:  backend ↔ mongo ↔ n8n (tamamen izole, dış erişim YOK)

services:
  # ========================
  # MongoDB Veritabanı (INTERNAL ONLY)
  # ========================
  mongo:
    image: mongo:7
    container_name: dietitian-mongo
    restart: unless-stopped
    # GÜVENLIK: Port dışarıya AÇILMAZ. Sadece sunucunun kendi içine (127.0.0.1) açılır, böylece SSH Tüneli ile bağlanılabilir.
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-online_dietitian_v1}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-dietitian_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_log:/var/log/mongodb
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    command: [ "mongod", "--config", "/etc/mongod.conf" ]
    networks:
      - backend-net
      - frontend-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.runCommand('ping').ok", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================
  # Backend API (FastAPI)
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dietitian-backend
    restart: unless-stopped
    # GÜVENLIK: Backend portu dışarıya AÇILMAZ. Nginx proxy kullanılır.
    expose:
      - "8000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URL=mongodb://${MONGO_APP_USERNAME:-dietitian_app}:${MONGO_APP_PASSWORD}@mongo:27017/${DATABASE_NAME:-online_dietitian_v1}?authSource=${DATABASE_NAME:-online_dietitian_v1}
      - DATABASE_NAME=${DATABASE_NAME:-online_dietitian_v1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_INGEST_SECRET=${N8N_INGEST_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========================
  # Frontend (React + Nginx Reverse Proxy)
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: dietitian-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  # ========================
  # n8n Otomasyon (INTERNAL + Basic Auth)
  # ========================
  n8n:
    image: n8nio/n8n:latest
    container_name: dietitian-n8n
    restart: unless-stopped
    # n8n yönetim portu — basic auth korumalı
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/}
      - N8N_HOST=0.0.0.0
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    networks:
      - backend-net
      - frontend-net
    security_opt:
      - no-new-privileges:true

# ========================
# Network Tanımları
# ========================
networks:
  # Frontend ↔ Backend iletişimi (dış erişim gerekli — port mapping)
  frontend-net:
    driver: bridge

  # Backend ↔ Mongo ↔ n8n (tamamen izole — dış ağ erişimi YOK)
  backend-net:
    driver: bridge
    internal: true

# ========================
# Volume Tanımları
# ========================
volumes:
  mongo_data:
  mongo_log:
  n8n_data:
