# docker-compose.yml - Online Dietitian Platform (SECURED)
# Kullanım: docker compose --env-file .env.production up -d --build

services:
  # ========================
  # MongoDB Veritabanı (INTERNAL ONLY)
  # ========================
  mongo:
    image: mongo:7
    container_name: dietitian-mongo
    restart: unless-stopped
    # GÜVENLIK: Dış dünyaya port AÇILMAZ. Sadece internal network.
    # "ports" tanımı YOK — bu sayede 27017 dışarıdan erişilemez.
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-online_dietitian_v1}
    volumes:
      - mongo_data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    command: ["mongod", "--config", "/etc/mongod.conf"]
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: >
        mongosh
        --username $${MONGO_INITDB_ROOT_USERNAME}
        --password $${MONGO_INITDB_ROOT_PASSWORD}
        --authenticationDatabase admin
        --eval "db.runCommand('ping').ok"
        --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================
  # Backend API (FastAPI)
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dietitian-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DATABASE_NAME:-online_dietitian_v1}?authSource=admin
      - DATABASE_NAME=${DATABASE_NAME:-online_dietitian_v1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================
  # Frontend (React + Nginx Reverse Proxy)
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: dietitian-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  # ========================
  # n8n Otomasyon (INTERNAL)
  # ========================
  n8n:
    image: n8nio/n8n:latest
    container_name: dietitian-n8n
    restart: unless-stopped
    # GÜVENLIK: n8n'i dışarıya AÇMAYIN. Yalnızca internal network.
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/}
      - N8N_HOST=0.0.0.0
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
    internal: false  # frontend dış erişim gerektirir

volumes:
  mongo_data:
  n8n_data:
