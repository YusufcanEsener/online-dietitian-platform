# GitHub Actions - Otomatik Deploy
# main branch'e push yapılınca sunucuya deploy eder

name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Sunucuya SSH ile bağlan ve deploy et
      - name: Sunucuya Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/dietitian-platform
            
            # Son kodu çek
            git pull origin main
            
            # Servisleri yeniden build et ve başlat
            docker compose up -d --build
            
            # Kullanılmayan image'ları temizle
            docker image prune -f
            
            echo "Deploy tamamlandı: $(date)"
