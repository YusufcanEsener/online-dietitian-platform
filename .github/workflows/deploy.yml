# GitHub Actions - Otomatik Deploy (PRODUCTION HARDENED)
# main branch'e push yapılınca sunucuya deploy eder

name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Sunucuya SSH ile bağlan ve deploy et
      - name: Sunucuya Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/online-dietitian-platform

            # Kodları zorla eşitle (Sunucudaki yerel değişiklikleri ez)
            git fetch origin main
            git reset --hard origin/main

            # .env.production dosyası kontrol
            if [ ! -f .env.production ]; then
              echo "❌ HATA: .env.production dosyası bulunamadı!"
              echo "Sunucuda .env.production dosyasını oluşturun."
              exit 1
            fi

            # Servisleri yeniden build et ve başlat (--no-cache: eski build cache kullanma)
            docker compose --env-file .env.production build --no-cache
            docker compose --env-file .env.production up -d --force-recreate

            # Kullanılmayan image'ları temizle
            docker image prune -f

            # Health check — 30 saniye bekle ve kontrol et
            echo "⏳ Servisler başlatılıyor, 30 saniye bekleniyor..."
            sleep 30

            # Container durumlarını kontrol et
            echo "📋 Container Durumları:"
            docker compose --env-file .env.production ps

            # Backend health check
            HEALTH=$(docker compose --env-file .env.production exec -T backend python -c "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); print(r.read().decode())" 2>&1 || true)
            echo "🏥 Backend Health: $HEALTH"

            if echo "$HEALTH" | grep -q "healthy"; then
              echo "✅ Deploy başarılı: $(date)"
            else
              echo "⚠️ Backend health check başarısız. Logları kontrol edin:"
              docker compose --env-file .env.production logs --tail=20 backend
              exit 1
            fi
